<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CosyFynix — Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* ---------- NAV WRAPPER (so Fynix can hang below the nav) ---------- */
  .nav-wrap{
    position: relative;
  }
  .fynix-bird{
    position: absolute;
    right: clamp(-10px, -1vw, 4px);
    top: 58%;
    width: clamp(56px, 7vw, 108px);
    transform: rotate(-8deg);
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }

  /* ---------- BLOG LAYOUT ---------- */
  .blog-layout{
    position: relative;
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: stretch;
    gap: clamp(1rem, 3vw, 2rem);
    padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 5vw, 3rem) clamp(3rem, 6vw, 5rem);
    flex-wrap: wrap;
  }

  .bookshelf-bg{
    position: absolute;
    left: clamp(-40px, -3vw, 0px);
    bottom: -6px;
    width: clamp(140px, 16vw, 230px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.95;
  }

  /* ---------- SIDEBAR TABS ---------- */
  .tabs{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    width: 240px;
    flex: 0 0 240px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(0,0,0,0.4);
  }

  .tab-btn{
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    text-align: center;
    color: var(--white);
    font-weight: 700;
    font-size: 1rem;
    padding: 1.05em 1em;
    background: var(--tab-color);
    border-bottom: 2px solid rgba(255,255,255,0.35);
    transition: filter 0.15s ease;
  }
  .tab-btn:last-child{ border-bottom: none; }
  .tab-btn:hover{ filter: brightness(1.1); }
  .tab-btn.active{
    box-shadow: inset 0 0 0 3px var(--white);
  }

  /* ---------- CONTENT PANEL ---------- */
  .content-wrap{
    position: relative;
    flex: 1 1 500px;
    min-width: 300px;
    display: flex;
  }

  .content-panel{
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 0;
    background: var(--blue);
    border: 4px solid var(--white);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .plant-corner{
    position: absolute;
    right: clamp(-30px, -3vw, -10px);
    bottom: clamp(-40px, -4vw, -20px);
    width: clamp(110px, 13vw, 175px);
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.35));
  }

  .content-inner{
    display: flex;
    flex: 1;
  }

  .content-main{
    flex: 1;
    min-width: 0;
    padding: clamp(1.5rem, 3vw, 2.5rem);
  }

  #cat-title{
    font-size: clamp(1.5rem, 2.6vw, 2rem);
    margin: 0 0 0.2em 0;
  }

  .coming-soon{
    font-weight: 600;
    opacity: 0.9;
    margin: 0 0 1.8em 0;
  }

  .placeholder-zones{
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .zone{
    border: 2px dashed rgba(255,255,255,0.55);
    border-radius: 16px;
    padding: clamp(1.5rem, 3vw, 2.2rem);
    text-align: center;
    background: rgba(255,255,255,0.06);
  }

  .zone-icon{ font-size: 1.9rem; line-height: 1; }
  .zone-label{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    margin-top: 0.35em;
  }
  .zone-sub{
    font-size: 0.85rem;
    opacity: 0.8;
    margin-top: 0.3em;
  }

  /* ---------- REACT / COMMENT COLUMN ---------- */
  .react-col{
    flex: 0 0 68px;
    width: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 2.5vw, 1.6rem);
    border-left: 2px solid rgba(255,255,255,0.25);
    padding: 1rem 0.25rem;
  }

  .react-btn{
    all: unset;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    color: var(--white);
    font-size: 0.62rem;
    font-weight: 700;
    text-align: center;
    transition: transform 0.15s ease;
  }
  .react-btn:hover{ transform: scale(1.15); }
  .react-btn svg{ width: 24px; height: 24px; }
  .react-count{ opacity: 0.85; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px){
    .content-inner{ flex-direction: column; }
    .react-col{
      flex-direction: row;
      width: 100%;
      border-left: none;
      border-top: 2px solid rgba(255,255,255,0.25);
      padding: 0.9rem 0.5rem;
    }
  }

  @media (max-width: 720px){
    .blog-layout{ flex-direction: column; padding-top: 1rem; }
    .bookshelf-bg{ display: none; }
    .tabs{ width: 100%; flex: 1 1 auto; }
    .fynix-bird{ width: clamp(56px, 16vw, 90px); top: 30%; }
  }
</style>
</head>
<body>

  <div class="nav-wrap">
    <nav class="garland-nav" aria-label="Primary">
      <a href="index.html" class="pill home">Home</a>
      <img src="assets/singlegarland.png" class="garland-strand" alt="">
      <a href="blog.html" class="pill blog-nav active">Blog</a>
      <img src="assets/singlegarland.png" class="garland-strand" alt="">
      <a href="#gallery" class="pill gallery">Gallery</a>
      <img src="assets/singlegarland.png" class="garland-strand" alt="">
      <a href="#contact" class="pill contact">Contact</a>
      <img src="assets/singlegarland.png" class="garland-mobile-full" alt="">
    </nav>
    <img src="assets/fynix.png" class="fynix-bird" alt="Fynix the bird mascot">
  </div>

  <main class="blog-layout">
    <img src="assets/bookshelf.png" class="bookshelf-bg" alt="">

    <aside class="tabs" id="tabs" aria-label="Blog categories">
      <button class="tab-btn active" data-cat="All" style="--tab-color: var(--cat-all)">All</button>
      <button class="tab-btn" data-cat="Art" style="--tab-color: var(--cat-art)">Art</button>
      <button class="tab-btn" data-cat="Craft" style="--tab-color: var(--cat-craft)">Craft</button>
      <button class="tab-btn" data-cat="Reading" style="--tab-color: var(--cat-reading)">Reading</button>
      <button class="tab-btn" data-cat="Random Writings" style="--tab-color: var(--cat-random)">Random Writings</button>
      <button class="tab-btn" data-cat="Video Games" style="--tab-color: var(--cat-videogames)">Video Games</button>
      <button class="tab-btn" data-cat="Cooking" style="--tab-color: var(--cat-cooking)">Cooking</button>
      <button class="tab-btn" data-cat="Music & Podcasts" style="--tab-color: var(--cat-music)">Music &amp; Podcasts</button>
      <button class="tab-btn" data-cat="Chronic Illness" style="--tab-color: var(--cat-chronic)">Chronic Illness</button>
    </aside>

    <div class="content-wrap">
      <section class="content-panel">
        <div class="content-inner">
          <div class="content-main">
            <h2 id="cat-title">All</h2>
            <p class="coming-soon">Coming soon!</p>

            <div class="placeholder-zones">
              <div class="zone gallery-zone">
                <div class="zone-icon">🖼️</div>
                <div class="zone-label">Gallery</div>
                <div class="zone-sub">Photos, art and other visual bits will live here</div>
              </div>
              <div class="zone text-zone">
                <div class="zone-icon">📝</div>
                <div class="zone-label">Text posts</div>
                <div class="zone-sub">Write-ups and rambles will live here</div>
              </div>
            </div>
          </div>

          <div class="react-col" aria-label="Reactions">
            <button class="react-btn" aria-label="Like this post">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>
              </svg>
              <span>Like</span>
            </button>
            <button class="react-btn" aria-label="Comment on this post">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
              </svg>
              <span>Comment</span>
            </button>
            <button class="react-btn" aria-label="Save this post">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Save</span>
            </button>
          </div>
        </div>
      </section>
      <img src="assets/plant.png" class="plant-corner" alt="">
    </div>
  </main>

<script>
  const tabs = document.querySelectorAll('.tab-btn');
  const title = document.getElementById('cat-title');
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      title.textContent = btn.dataset.cat;
    });
  });
</script>

</body>
</html>
